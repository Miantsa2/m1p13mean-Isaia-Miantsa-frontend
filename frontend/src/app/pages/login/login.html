<div class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
  <div class="max-w-4xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row min-h-[550px]">
    
    <div class="md:w-5/12 bg-[#345e63] p-10 flex flex-col justify-between text-white relative">
      <div class="z-10 pt-16">
        <h1 class="text-4xl font-bold leading-tight uppercase tracking-wide">
          Log into <br> your account
        </h1>
        <p class="mt-4 text-gray-300 text-sm">
          Don't have an account? 
          <a routerLink="/sign" class="text-yellow-500 hover:underline font-semibold">Sign in</a>
        </p>
      </div>

      <div class="mt-auto pt-10">
        <img src="/login.png" alt="Community" class="w-full object-contain">
      </div>
    </div>

    <div class="md:w-7/12 bg-white p-10 md:p-14 flex flex-col items-center justify-center md:rounded-bl-[80px] z-20">
      
      <span class="material-symbols-outlined text-[80px] text-gray-400 mb-2">account_circle</span>

      <h2 class="text-3xl font-black text-[#345e63] mb-10 tracking-tight">WELCOME BACK!</h2>

      <form class="w-full max-w-sm space-y-8">
        <div class="relative group border-b border-gray-300 focus-within:border-[#345e63] transition-all pt-4">
            <input 
                type="email" 
                id="email"
                placeholder=" " 
                class="peer w-full pb-1 bg-transparent outline-none text-gray-700 text-sm"
            >
            <label 
                for="email"
                class="absolute left-0 top-4 text-gray-400 text-sm transition-all duration-300 cursor-text
                    peer-placeholder-shown:top-4 peer-placeholder-shown:text-sm 
                    peer-focus:-top-1 peer-focus:text-xs peer-focus:text-[#345e63]
                    peer-[:not(:placeholder-shown)]:-top-1 peer-[:not(:placeholder-shown)]:text-xs"
            >
                Address e-mail
            </label>
        </div>

        <div class="relative group border-b border-gray-300 focus-within:border-[#345e63] transition-all pt-4 mt-6">
            <input 
                type="password" 
                id="password"
                placeholder=" " 
                class="peer w-full pb-1 bg-transparent outline-none text-gray-700 text-sm"
            >
            <label 
                for="password"
                class="absolute left-0 top-4 text-gray-400 text-sm transition-all duration-300 cursor-text
                    peer-placeholder-shown:top-4 peer-placeholder-shown:text-sm 
                    peer-focus:-top-1 peer-focus:text-xs peer-focus:text-[#345e63]
                    peer-[:not(:placeholder-shown)]:-top-1 peer-[:not(:placeholder-shown)]:text-xs"
            >
                Password
            </label>
        </div>

        <div class="pt-4">
          <button type="submit" 
            class="w-full bg-[#8ca3a6] hover:bg-[#7a8f92] text-white font-semibold py-3 px-6 rounded shadow transition-colors uppercase text-sm tracking-widest">
            Submit
          </button>
        </div>

        <div class="py-2"></div>

        <button type="button" 
            class="w-full flex items-center justify-center gap-3 border border-gray-300 hover:bg-gray-100 py-2.5 px-4 rounded-lg transition-all text-gray-700 font-medium text-sm">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="w-5 h-5">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                <path fill="none" d="M0 0h48v48H0z"/>
            </svg>
            <span>Continue with Google</span>
        </button>
      </form>
    </div>
  </div>
</div>
