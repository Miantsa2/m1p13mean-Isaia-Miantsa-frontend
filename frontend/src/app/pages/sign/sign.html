<div class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
  <div class="max-w-4xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row min-h-[650px]">
    
    <div class="md:w-5/12 bg-[#345e63] p-10 flex flex-col justify-between text-white relative">
      <div class="z-10 pt-16">
        <h1 class="text-4xl font-bold leading-tight uppercase tracking-wide">
          Create <br> your account
        </h1>
        <p class="mt-4 text-gray-300 text-sm">
          Already have an account? 
          <a routerLink="/login" class="text-yellow-500 hover:underline font-semibold">Log in</a>
        </p>
      </div>

      <div class="mt-auto">
        <img src="/sign.png" alt="Shopping" class="w-full object-contain">
      </div>
    </div>

    <div class="md:w-7/12 bg-white p-8 md:p-12 flex flex-col items-center justify-center md:rounded-bl-[80px] z-20">
      
      <span class="material-symbols-outlined text-[60px] text-[#355F68] mb-8">person_add</span>

      <form class="w-full max-w-md space-y-6">
        
        <div class="grid grid-cols-2 gap-6">
          <div class="relative group border-b border-gray-300 focus-within:border-[#345e63] transition-all pt-4">
            <input type="text" id="firstname" placeholder=" " class="peer w-full pb-1 bg-transparent outline-none text-gray-700 text-sm">
            <label for="firstname" class="absolute left-0 top-4 text-gray-400 text-sm transition-all duration-300 cursor-text peer-placeholder-shown:top-4 peer-placeholder-shown:text-sm peer-focus:-top-1 peer-focus:text-xs peer-focus:text-[#345e63] peer-[:not(:placeholder-shown)]:-top-1 peer-[:not(:placeholder-shown)]:text-xs">First name</label>
          </div>
          <div class="relative group border-b border-gray-300 focus-within:border-[#345e63] transition-all pt-4">
            <input type="text" id="lastname" placeholder=" " class="peer w-full pb-1 bg-transparent outline-none text-gray-700 text-sm">
            <label for="lastname" class="absolute left-0 top-4 text-gray-400 text-sm transition-all duration-300 cursor-text peer-placeholder-shown:top-4 peer-placeholder-shown:text-sm peer-focus:-top-1 peer-focus:text-xs peer-focus:text-[#345e63] peer-[:not(:placeholder-shown)]:-top-1 peer-[:not(:placeholder-shown)]:text-xs">Last name</label>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-6">
          <div class="relative border-b border-gray-300 focus-within:border-[#345e63] transition-all pt-4 flex items-center">
            <select id="genre" class="peer w-full pb-1 bg-transparent outline-none text-gray-700 text-sm appearance-none cursor-pointer">
              <option value="" disabled selected></option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
            <label for="genre" class="absolute left-0 top-4 text-gray-400 text-sm transition-all duration-300 pointer-events-none peer-focus:-top-1 peer-focus:text-xs peer-focus:text-[#345e63] peer-valid:-top-1 peer-valid:text-xs">Genre</label>
            <span class="material-symbols-outlined text-gray-400 text-sm pointer-events-none">expand_more</span>
          </div>
          <div class="relative border-b border-gray-300 focus-within:border-[#345e63] transition-all pt-4">
            <input type="text" onfocus="(this.type='date')" id="birthday" placeholder=" " class="peer w-full pb-1 bg-transparent outline-none text-gray-700 text-sm">
            <label for="birthday" class="absolute left-0 top-4 text-gray-400 text-sm transition-all duration-300 cursor-text peer-placeholder-shown:top-4 peer-placeholder-shown:text-sm peer-focus:-top-1 peer-focus:text-xs peer-focus:text-[#345e63] peer-[:not(:placeholder-shown)]:-top-1 peer-[:not(:placeholder-shown)]:text-xs">Birthday</label>
          </div>
        </div>

        <div class="relative group border-b border-gray-300 focus-within:border-[#345e63] transition-all pt-4">
          <input type="email" id="email" placeholder=" " class="peer w-full pb-1 bg-transparent outline-none text-gray-700 text-sm">
          <label for="email" class="absolute left-0 top-4 text-gray-400 text-sm transition-all duration-300 cursor-text peer-placeholder-shown:top-4 peer-placeholder-shown:text-sm peer-focus:-top-1 peer-focus:text-xs peer-focus:text-[#345e63] peer-[:not(:placeholder-shown)]:-top-1 peer-[:not(:placeholder-shown)]:text-xs">Address e-mail</label>
        </div>

        <div class="relative group border-b border-gray-300 focus-within:border-[#345e63] transition-all pt-4">
          <input type="password" id="password" placeholder=" " class="peer w-full pb-1 bg-transparent outline-none text-gray-700 text-sm">
          <label for="password" class="absolute left-0 top-4 text-gray-400 text-sm transition-all duration-300 cursor-text peer-placeholder-shown:top-4 peer-placeholder-shown:text-sm peer-focus:-top-1 peer-focus:text-xs peer-focus:text-[#345e63] peer-[:not(:placeholder-shown)]:-top-1 peer-[:not(:placeholder-shown)]:text-xs">Password</label>
        </div>

        <div class="relative group border-b border-gray-300 focus-within:border-[#345e63] transition-all pt-4">
          <input type="text" id="address" placeholder=" " class="peer w-full pb-1 bg-transparent outline-none text-gray-700 text-sm">
          <label for="address" class="absolute left-0 top-4 text-gray-400 text-sm transition-all duration-300 cursor-text peer-placeholder-shown:top-4 peer-placeholder-shown:text-sm peer-focus:-top-1 peer-focus:text-xs peer-focus:text-[#345e63] peer-[:not(:placeholder-shown)]:-top-1 peer-[:not(:placeholder-shown)]:text-xs">Local Address</label>
        </div>

        <div class="pt-6 space-y-4">
          <button type="submit" class="w-full bg-[#8DA5AA] hover:bg-[#7a8f92] text-white font-semibold py-3 px-6 rounded shadow transition-all uppercase text-sm tracking-widest">
            Submit
          </button>

          <button type="button" class="w-full flex items-center justify-center gap-3 border border-gray-300 hover:bg-gray-50 py-2 px-4 rounded transition-all text-gray-600 text-sm">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="w-5 h-5">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
            <span>Continue with Google</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
