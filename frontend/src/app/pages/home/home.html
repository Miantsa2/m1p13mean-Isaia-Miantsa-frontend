<!-- Test 5: Tableau pour les différentes listes -->
<div class="p-6">
  <app-table-corps [columns]="tableColumns">

    <tr
      *ngFor="let row of tableRows"
      class="border-t border-slate-200"
    >
      <td class="px-4 py-3 text-sm text-[#375E67] ">
        {{ row.name }}
      </td>

      <td class="px-4 py-3 text-sm text-[#375E67]">
        {{ row.category }}
      </td>

      <td class="px-4 py-3 text-sm text-[#375E67]">
        {{ row.price }} Ar
      </td>
    </tr>

  </app-table-corps>
</div>
