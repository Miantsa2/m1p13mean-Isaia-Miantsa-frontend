<div class="min-h-screen p-4 bg-white">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-normal text-[#697F84] uppercase tracking-wide">
      Rent tracking
    </h1>
    <app-button-primaire text="PAY RENT" (click)="openPayModal()" [disabled]="isLoyerPaye"></app-button-primaire>


  </div>

  <div class="max-w-4xl p-4 mx-auto bg-white shadow rounded-2xl">
    <full-calendar [options]="calendarOptions"></full-calendar>
  </div>
</div>





<!-- Modal de paiement loyer -->
<app-modal-form
    title="RENT PAYEMENT"
    buttonText="CONFIRM"
    [isOpen]="isPayModalOpen"
    (close)="closePayModel()"
    (submitForm)="confirmPayment()"
    [disable]="isFormInvalid()"
    
>
    <div class="grid grid-cols-2 gap-x-8 gap-y-6">

      <div *ngIf="errorMessage" class="text-red-500 mt-2 flex flex-col gap-1">
            {{ errorMessage }}
      </div>


        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-[#697F84] uppercase">Date</label>
            <input disabled name=" date_limite" [(ngModel)]="paymentForm.date_limite" type="date" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#4D9893] text-sm text-slate-600">
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-[#697F84] uppercase">Value</label>
            <input disabled  [(ngModel)]="paymentForm.valeur" type="number" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#4D9893] text-sm text-slate-600">
        </div>

         <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-[#697F84] uppercase">Card Information</label>
            <div id="card-element" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#4D9893] text-sm text-slate-600"></div>
        </div>
        <div id="card-errors" class="flex flex-col gap-1 mt-2 text-sm font-medium text-red-600" role="alert"></div>
        <div id="card-succes" class="flex flex-col gap-1" role="alert"></div>






    </div>
    
</app-modal-form>
