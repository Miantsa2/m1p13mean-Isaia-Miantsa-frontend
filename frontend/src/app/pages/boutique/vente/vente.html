<div class="min-h-screen p-4 bg-[#fffdfd]">
    <div class="mb-10">
        <h1 class="text-2xl font-bold text-[#3A626B] tracking-tight uppercase">Sales</h1>
    </div>

    <div class="flex items-center gap-12 mb-8">
        <div class="flex items-center gap-4 cursor-pointer group">
            <span class="text-sm font-semibold text-[#3A626B] uppercase tracking-wider">Status</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-[#3A626B] transition-transform group-hover:translate-y-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
        </div>

        <div class="flex items-center gap-3 cursor-pointer group">
            <span class="text-sm font-semibold text-[#3A626B] uppercase tracking-wider">Most recent sales</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-[#3A626B]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
            </svg>
        </div>
    </div>

    <app-table-corps [columns]="salesColumns">
        @for (sale of salesData; track sale._id) {
            <tr class="transition-colors border-b border-gray-100 hover:bg-gray-50/50">
                <td class="px-4 py-6 text-[#3A626B] font-bold">{{ sale.clientNom }}</td>
                
                <td class="px-4 py-6 text-[#3A626B] font-medium">
                    {{ sale.totalOrder | number:'1.0-0' }}
                </td>
                
                <td class="px-4 py-6 text-[#3A626B]">
                    {{ sale.orderDate | date:'dd-MM-yyyy' }}
                </td>

                <td class="px-4 py-6">
                    <span class="text-[13px] font-bold uppercase tracking-wide" [ngClass]="{
                        'text-green-600': sale.status === 'Confirmed',
                        'text-orange-400': sale.status === 'To deliver'
                    }">
                        {{ sale.status }}
                    </span>
                </td>

                <td class="px-4 py-6">
                    <button class="px-8 py-2 bg-[#67949E] text-white text-[12px] font-bold uppercase tracking-widest rounded shadow-sm hover:bg-[#527a82] transition-all min-w-[130px]">
                        {{ sale.status === 'Confirmed' ? 'Details' : 'Plan deliver' }}
                    </button>
                </td>
            </tr>
        } @empty {
            <tr>
                <td [attr.colspan]="salesColumns.length" class="py-12 italic text-center text-gray-400">
                    No sales recorded yet.
                </td>
            </tr>
        }  
    </app-table-corps>
</div>
