<div class="p-6 bg-gray-50 min-h-screen">
  <h2 class="text-2xl font-black text-[#3A626B] mb-6 uppercase tracking-tight">
    Tableau de Bord
  </h2>

    <div class="flex flex-wrap gap-4 mb-6">
    <div>
      <label class="block text-gray-600 font-bold mb-1">Mois</label>
      <select [(ngModel)]="selectedMonth" class="border rounded p-2" (change)="applyFilters()">
        <option value="">Tous</option>
        <option *ngFor="let m of months" [value]="m.value">{{ m.name }}</option>
      </select>
    </div>

    
  </div>


  <!-- KPIs : une par ligne sur mobile, 2 par ligne sur tablette, 3 par ligne sur desktop -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

    <!-- Visiteurs -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border-b-4 border-blue-500">
      <div class="flex justify-between items-center">
        <div>
          <p class="text-sm text-gray-500 font-bold uppercase">Visiteurs</p>
          <h3 class="text-3xl font-black text-gray-800">{{ visitors }}</h3>
        </div>
        <div class="bg-blue-100 p-3 rounded-full text-blue-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Chiffre d’Affaire -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border-b-4 border-green-500">
      <div class="flex justify-between items-center">
        <div>
          <p class="text-sm text-gray-500 font-bold uppercase">Chiffre d'Affaire</p>
          <h3 class="text-3xl font-black text-gray-800">{{ chiffreAffaire }}</h3>
        </div>
        <div class="bg-green-100 p-3 rounded-full text-green-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Boutiques -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border-b-4 border-[#E9AD59]">
      <div class="flex justify-between items-center">
        <div>
          <p class="text-sm text-gray-500 font-bold uppercase">Boutiques</p>
          <h3 class="text-3xl font-black text-gray-800">{{ stores }}</h3>
        </div>
        <div class="bg-orange-100 p-3 rounded-full text-[#E9AD59]">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Locaux Libres -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border-b-4 border-red-400">
      <div class="flex justify-between items-center">
        <div>
          <p class="text-sm text-gray-500 font-bold uppercase">Locaux Libres</p>
          <h3 class="text-3xl font-black text-gray-800">{{ roomsLibres }}</h3>
        </div>
        <div class="bg-red-100 p-3 rounded-full text-red-500">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Produits -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border-b-4 border-purple-500">
      <div class="flex justify-between items-center">
        <div>
          <p class="text-sm text-gray-500 font-bold uppercase">Produits</p>
          <h3 class="text-3xl font-black text-gray-800">{{ totalProducts }}</h3>
        </div>
        <div class="bg-purple-100 p-3 rounded-full text-purple-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M20 13V7a2 2 0 00-2-2H6a2 2 0 00-2 2v6m16 0v6a2 2 0 01-2 2H6a2 2 0 01-2-2v-6m16 0H4" />
          </svg>
        </div>
      </div>
    </div>

  </div>

  <!-- Graphiques -->
  <div class="mt-12 grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- Graphique évolution -->
    <div class="bg-white p-6 rounded-2xl shadow-sm lg:col-span-2">
      <h3 class="text-lg font-bold text-[#3A626B] mb-4">
        Evolution du Chiffre d'Affaire
      </h3>

      <canvas
        baseChart
        [data]="lineChartData"
        [options]="lineChartOptions"
        [type]="'line'">
      </canvas>
    </div>

    <!-- Camembert répartition -->
    <div class="bg-white p-6 rounded-2xl shadow-sm flex flex-col items-center">
      <h3 class="text-lg font-bold text-[#3A626B] mb-4">
        Répartition du Chiffre d'Affaire
      </h3>

      <div class="w-56 h-56">
        <canvas
          baseChart
          [data]="pieChartData"
          [type]="'pie'">
        </canvas>
      </div>
    </div>

  </div>
</div>
