<div class="p-6 bg-gray-50 min-h-screen">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-normal text-[#697F84] uppercase tracking-wide">Dashboard</h1>
    
  </div>
  <div class="flex flex-wrap items-center gap-8 mb-8">
  
   <div class="relative flex items-center gap-2 text-[#3A626B]">
      <span class="font-normal">Month</span>
      <div class="relative flex items-center">
        <select 
          [(ngModel)]="selectedMonth" 
          (change)="applyFilters()"
          class="py-0 pr-8 text-[gray] bg-transparent border-none appearance-none cursor-pointer focus:ring-0">
          <option value="all">All</option>
          <option value="1">January</option>
          <option value="2">February</option>
          <option value="3">March</option>
          <option value="4">April</option>
          <option value="5">May</option>
          <option value="6">June</option>
          <option value="7">July</option>
          <option value="8">August</option>
          <option value="9">September</option>
          <option value="10">October</option>
          <option value="11">November</option>
          <option value="12">December</option>

        </select>
        <span class="absolute right-0 text-sm pointer-events-none material-symbols-outlined">
          arrow_downward
        </span>
      </div>
    </div>


    <div class="relative flex items-center gap-2 text-[#3A626B]">
      <span class="font-normal">Year</span>
      <div class="relative flex items-center">
        <select 
          [(ngModel)]="selectedYear" 
          (change)="applyFilters()"
          class="py-0 pr-8 text-[gray] bg-transparent border-none appearance-none cursor-pointer focus:ring-0">
          <option value="all">All</option>
          <option value="2024">2024</option>
          <option value="2025">2025</option>
          <option value="2026">2026</option>

        </select>
        <span class="absolute right-0 text-sm pointer-events-none material-symbols-outlined">
          arrow_downward
        </span>
      </div>
    </div>
  </div>



  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

    <!-- Visiteurs -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border-b-4 border-blue-500">
      <div class="flex justify-between items-center">
        <div>
          <p class="text-sm text-gray-500 font-bold uppercase">Visitors</p>
          <h3 class="text-3xl font-black text-gray-800">{{ visitors }}</h3>
        </div>
        <div class="bg-blue-100 p-3 rounded-full text-blue-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Chiffre d’Affaire -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border-b-4 border-green-500">
      <div class="flex justify-between items-center">
        <div>
          <p class="text-sm text-gray-500 font-bold uppercase">Turnover</p>
          <h3 class="text-3xl font-black text-gray-800">{{ chiffreAffaire }}</h3>
        </div>
        <div class="bg-green-100 p-3 rounded-full text-green-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Boutiques -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border-b-4 border-[#E9AD59]">
      <div class="flex justify-between items-center">
        <div>
          <p class="text-sm text-gray-500 font-bold uppercase">Stores</p>
          <h3 class="text-3xl font-black text-gray-800">{{ stores }}</h3>
        </div>
        <div class="bg-orange-100 p-3 rounded-full text-[#E9AD59]">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
          </svg>
        </div>
      </div>
    </div>

  </div>

  <!-- Graphiques -->
  <div class="mt-12 grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- Graphique évolution -->
    <div class="bg-white p-6 rounded-2xl shadow-sm lg:col-span-2">
      <h3 class="text-lg font-bold text-[#3A626B] mb-4">
        Turnover Evolution
      </h3>

      <canvas
        baseChart
        [data]="lineChartData"
        [options]="lineChartOptions"
        [type]="'line'">
      </canvas>
    </div>

    <!-- Camembert répartition -->
    <div class="bg-white p-6 rounded-2xl shadow-sm flex flex-col items-center">
      <h3 class="text-lg font-bold text-[#3A626B] mb-4">
        Turnover Breakdown
      </h3>
        <canvas
          baseChart
          [data]="pieChartData"
          [type]="'pie'">
        </canvas>
    </div>


    <div class="bg-white p-6 rounded-2xl shadow-sm flex flex-col items-center">
      <h3 class="text-lg font-bold text-[#3A626B] mb-4">
       Room allocation
      </h3>   
        <canvas
          baseChart
          [data]="roomsPieChart"
          [type]="'pie'">
        </canvas>
    </div>

     <div class="bg-white p-6 rounded-2xl shadow-sm lg:col-span-2">
      <h3 class="text-lg font-bold text-[#3A626B] mb-4">Top stores by products</h3>
      
        <canvas
          baseChart
          [data]="productsChartData"
          [options]="productsChartOptions"
          chartType="bar">
        </canvas>

    </div>

    


  </div>
</div>
