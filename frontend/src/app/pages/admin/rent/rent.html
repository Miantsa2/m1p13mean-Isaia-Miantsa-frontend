<div class="min-h-screen p-4">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-normal text-[#697F84] uppercase tracking-wide">
      Rent tracking
    </h1>
  </div>

  <div class="max-w-4xl mx-auto bg-white p-4 rounded-2xl shadow">
    <full-calendar [options]="calendarOptions"></full-calendar>
  </div>
</div>


<!-- Modal de paiement loyer -->
<app-modal-form
    title="RENT VALIDATION"
    buttonText="CONFIRM"
    [isOpen]="isAddModalOpen"
    (close)="closeAddModel()"
    (submitForm)="createCharge()"
    [disable]="isFormInvalid()"
>
    <div class="grid grid-cols-2 gap-x-8 gap-y-6">

        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-[#697F84] uppercase">Name Store</label>
            <select (change)="onBoutiqueChange($event)" name ="boutique" [(ngModel)]="paymentForm.boutique" class="w-full px-3 py-2 border border-slate-300 rounded-md bg-white focus:outline-none focus:ring-1 focus:ring-[#4D9893] text-sm text-slate-400">
                <option value="" disabled selected>Select Store</option>
                @for (store of stores; track store._id) {
                    <option [value]="store._id">
                        {{ store.nom }}
                    </option>
                }
            </select>
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-[#697F84] uppercase">Date</label>
            <input disabled name=" date_limite" [(ngModel)]="paymentForm.date_limite" type="date" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#4D9893] text-sm text-slate-600">
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-[#697F84] uppercase">Value</label>
            <input disabled  [(ngModel)]="paymentForm.valeur" type="number" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#4D9893] text-sm text-slate-600">
        </div>

    </div>
    
</app-modal-form>
