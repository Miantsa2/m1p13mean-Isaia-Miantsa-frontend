<div class="min-h-screen p-4">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-normal text-[#697F84] uppercase tracking-wide">Stores</h1>
        <app-button-primaire text="REGISTER NEW STORE" (click)="openAddModal()"></app-button-primaire>
    </div>

    <div class="relative flex items-center gap-2 text-[#3A626B]">
        <span class="font-normal pointer-events-none">Categories</span>
        
        <div class="relative flex items-center">
            <select 
                [(ngModel)]="selectedCategory" 
                (change)="applyFilter()"
                class="py-0 pr-8 text-[gray] font-normal leading-tight bg-transparent border-none appearance-none cursor-pointer focus:outline-none focus:ring-0"
            >
                <option value="all">All</option>
                @for (cat of categories; track cat._id) {
                    <option [value]="cat._id">
                        {{ cat.nom }}
                    </option>
                }
            </select>
            
            <span class="absolute right-0 text-sm pointer-events-none material-symbols-outlined">
                arrow_downward
            </span>
        </div>

        <div class="relative flex items-center gap-2 text-[#3A626B] ml-10">
            <span class="font-normal">Search</span>
            <div class="relative flex items-center">
                <input 
                    type="text" 
                    [(ngModel)]="searchQuery" 
                    (input)="applyFilter()"
                    placeholder="Store name..."
                    class="px-2 py-1 text-sm border-b border-slate-300 focus:border-[#4D9893] outline-none bg-transparent text-slate-600"
                >
                <span class="text-sm material-symbols-outlined text-slate-400">search</span>
            </div>
        </div>
    </div>

    <!-- Ici, je vais mettre la liste des stores -->
    <div class="grid grid-cols-1 gap-10 md:grid-cols-2 lg:grid-cols-3 min-h-[300px]">
        @if (filteredStores.length === 0) {
            <div class="flex flex-col items-center justify-center text-center col-span-full text-slate-400">
            
                <span class="mb-3 text-6xl material-symbols-outlined">
                    storefront
                </span>

                <p class="text-lg font-light">No store found</p>
                <p class="text-sm">Try changing filters or create a new store</p>

            </div>
        } @else {
            @for (item of filteredStores; track item._id) {
            <app-store-card-admin 
                (deleted)="loadBoutiques()"
                [boutiqueId]="item._id"
                [logo]="getStoreImage(item.logo)"
                [name]="item.nom"
                [salle_ref]="item.salle?.reference"
                [metre_carre]="item.salle?.tailleMetreCarre">
            </app-store-card-admin>
            }
        }

    </div>
</div>


<!-- Modal d'ajout d'un store -->
<app-modal-form
    title="REGISTER A NEW STORE"
    buttonText="CONFIRM"
    [isOpen]="isModalAddOpen"
    (close)="closeAddModal()"
    (submitForm)="createStore()"
>
    <div class="grid grid-cols-2 gap-x-8 gap-y-6">
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-[#697F84] uppercase">Name Store</label>
            <input [(ngModel)]="form.nom" type="text" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#4D9893] text-sm text-slate-600">
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-[#697F84] uppercase">Category</label>
            <select [(ngModel)]="form.categorie" class="w-full px-3 py-2 border border-slate-300 rounded-md bg-white focus:outline-none focus:ring-1 focus:ring-[#4D9893] text-sm text-slate-400">
                <option value="" disabled selected>Select category</option>
                @for (cat of categories; track cat._id) {
                    <option [value]="cat._id">
                        {{ cat.nom }}
                    </option>
                }
            </select>
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-[#697F84] uppercase">Address E-mail</label>
            <input [(ngModel)]="form.email" type="email" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#4D9893] text-sm text-slate-600">
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-[#697F84] uppercase">Password</label>
            <input [(ngModel)]="form.password" type="password" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#4D9893] text-sm text-slate-600">
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-[#697F84] uppercase">Assigned Room</label>
            <select
                [(ngModel)]="form.salle"
                class="w-full px-3 py-2 bg-white border rounded-md border-slate-300"
                >
                <option value="" disabled>Select room</option>

                @for (room of freeRooms; track room._id) {
                    <option [value]="room._id">
                    {{ room.reference }} - {{ room.tailleMetreCarre }} m²
                    </option>
                }
            </select>
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-[#697F84] uppercase">Phone Number</label>
            <input [(ngModel)]="form.telephone" type="number" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#4D9893] text-sm text-slate-600">
        </div>
    </div>
    
</app-modal-form>
