<div class="min-h-screen p-4">
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-normal text-[#697F84] uppercase tracking-wide">Stores</h1>
        <app-button-primaire text="REGISTER NEW STORE" (click)="openAddModal()"></app-button-primaire>
    </div>

    <div class="relative flex items-center gap-2 text-[#3A626B]">
        <span class="font-normal pointer-events-none">Categories</span>
        
        <div class="relative flex items-center">
            <select 
                class="py-0 pr-8 text-[gray] font-normal leading-tight bg-transparent border-none appearance-none cursor-pointer focus:outline-none focus:ring-0"
            >
                <option value="all">All</option>
                <option value="free">Shop & Fashion</option>
                <option value="occupied">Food & Drinks</option>
            </select>
            
            <span class="absolute right-0 text-sm pointer-events-none material-symbols-outlined">
                arrow_downward
            </span>
        </div>
    </div>

    <!-- Ici, je vais mettre la liste des stores -->
     <div class="grid grid-cols-1 gap-10 md:grid-cols-2 lg:grid-cols-3">
        @for (item of stores; track $index) {
            <app-store-card-admin 
                [logo]="item.logo" 
                [salle_ref]="item.salle_ref"
                [metre_carre]="item.metre_carre">
            </app-store-card-admin>
        }
    </div>
</div>


<!-- Modal d'ajout d'un store -->
<app-modal-form
    title="REGISTER A NEW STORE"
    buttonText="CONFIRM"
    [isOpen]="isModalAddOpen"
    (close)="closeAddModal()"
>
    <div class="grid grid-cols-2 gap-x-8 gap-y-6">
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-[#697F84] uppercase">Name Store</label>
            <input type="text" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#4D9893] text-sm text-slate-600">
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-[#697F84] uppercase">Category</label>
            <select class="w-full px-3 py-2 border border-slate-300 rounded-md bg-white focus:outline-none focus:ring-1 focus:ring-[#4D9893] text-sm text-slate-400">
                <option value="" disabled selected>Select category</option>
                <option value="food">Food & Drinks</option>
                <option value="fashion">Shop & Fashion</option>
            </select>
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-[#697F84] uppercase">Address E-mail</label>
            <input type="email" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#4D9893] text-sm text-slate-600">
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-[#697F84] uppercase">Assigned Room</label>
            <select class="w-full px-3 py-2 border border-slate-300 rounded-md bg-white focus:outline-none focus:ring-1 focus:ring-[#4D9893] text-sm text-slate-400">
                <option value="" disabled selected>Select room</option>
                <option value="001">Room 001</option>
                <option value="002">Room 002</option>
            </select>
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-[#697F84] uppercase">Store Rent</label>
            <input type="number" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-[#4D9893] text-sm text-slate-600">
        </div>
    </div>
    
</app-modal-form>
