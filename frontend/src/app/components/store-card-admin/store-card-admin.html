<div class="relative flex flex-col w-64 h-64 p-6 bg-white shadow-md mt-11 rounded-3xl">

    <div class="flex items-center justify-center w-full h-40">
        <img [src]="logo" 
             [alt]="logo" 
             class="object-contain max-w-full max-h-full mx-auto" />
    </div>

    <div class="absolute flex items-center justify-between bottom-6 left-6 right-6">
        <span class="text-[15px] font-semibold text-[#1A4A54] truncate mr-2">
            {{ salle_ref }} - {{ metre_carre }}m²
        </span>
        
        <button (click)="openEditModal()" class="flex items-center justify-center text-[#4D9893] transition-transform hover:scale-110">
            <span class="text-xl material-symbols-outlined">edit_square</span>
        </button>

        <button class="flex items-center justify-center transition-transform text-[#FC0005] hover:scale-110">
            <span class="text-xl material-symbols-outlined">delete</span>
        </button>
    </div>
</div>

<!-- Modal d'édition -->
 <app-modal-form
  title="UPDATE STORE" 
  buttonText="UPDATE"
  [isOpen]="isModalEditOpen"
  (close)="closeEditModal()"
>  
  <div class="grid grid-cols-2 gap-x-8 gap-y-6"> <!-- Ici j'ai spécifié oe 2 colonnes et pas plus, tu dois un peu modifier ceci raha miotra-->
    <div class="flex flex-col gap-2">
      <label class="text-xs font-semibold text-[#697F84] uppercase tracking-wider">Room Reference</label>
      <input 
        type="text" 
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-[#E9B162] transition-all"
      >
    </div>
  </div>
</app-modal-form>
