@if (isVisible()) {
  <div class="fixed bottom-6 right-6 z-[9999] w-64 animate-bounce-subtle">
    
    <button (click)="isVisible.set(false)" 
            class="absolute -top-2 -right-2 bg-[#3A626B] text-white rounded-full w-6 h-6 flex items-center justify-center text-sm shadow-lg hover:bg-red-500 transition-colors z-10">
      ×
    </button>

    <a [href]="adsList[currentIndex()].link" 
       class="block p-5 bg-white border-b-4 border-[#E9AD59] rounded-xl shadow-2xl hover:scale-105 transition-transform duration-300 no-underline">
      
      <div class="flex flex-col gap-2">
        <span class="text-[10px] font-bold uppercase tracking-[0.2em] text-[#E9AD59]">Suggestions</span>
        
        <div>
          <h3 class="text-[#3A626B] font-black text-lg leading-tight uppercase tracking-tighter">
            {{ adsList[currentIndex()].produit }}
          </h3>
          <p class="text-xs italic text-gray-500">
            at {{ adsList[currentIndex()].boutique }}
          </p>
        </div>

        <div class="mt-2 flex items-center text-[#3A626B] text-[11px] font-bold uppercase tracking-widest">
          Check it out
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </div>
      </div>
    </a>
  </div>
}
