@if (isVisible() && adsList && adsList[currentIndex()]) {
  <div class="fixed top-20 right-6 z-[9999] w-72 animate-bounce-subtle">
    
    <button (click)="isVisible.set(false)" 
            class="absolute -top-2 -right-2 bg-[#3A626B] text-white rounded-full w-6 h-6 flex items-center justify-center text-sm shadow-lg hover:bg-red-500 transition-colors z-10">
      ×
    </button>
    
    <a [href]="adsList[currentIndex()]?.link" 
       class="block p-4 bg-white border-b-4 border-[#E9AD59] rounded-xl shadow-2xl hover:scale-105 transition-transform duration-300 no-underline">
      
      <div class="flex items-center gap-4">
        <div class="flex-shrink-0">
          <img [src]="getProductImage(adsList[currentIndex()].image)" 
               [alt]="adsList[currentIndex()].produit"
               class="object-cover w-16 h-16 border border-gray-100 rounded-lg shadow-sm">
        </div>

        <div class="flex flex-col overflow-hidden">
          <span class="text-[9px] font-bold uppercase tracking-[0.2em] text-[#E9AD59]">SUGGESTIONS</span>
          
          <h3 class="text-[#3A626B] font-black text-sm leading-tight uppercase truncate">
            {{ adsList[currentIndex()].produit }}
          </h3>
          <p class="text-[10px] italic text-gray-400 truncate">
            {{ adsList[currentIndex()].boutique }}
          </p>

          <div class="mt-1 flex items-center text-[#3A626B] text-[10px] font-bold uppercase">
            CHECK IT OUT
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </div>
        </div>
      </div>
    </a>
  </div>
}
