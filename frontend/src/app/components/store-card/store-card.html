<div class="relative bg-white rounded-3xl shadow-md p-6 w-64 h-64">
    <img [src]="image" [alt]="description" class="max-h-48 max-w-full object-contain mx-auto" />

    <p class="absolute bottom-4 left-1/2 transform -translate-x-1/2 text-xs font-normal text-[#1A4A54] text-center w-full">
        {{ description }}
    </p>
</div>
