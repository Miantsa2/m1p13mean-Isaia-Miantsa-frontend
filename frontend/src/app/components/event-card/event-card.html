

<div
  class="flex flex-col gap-4 bg-white rounded-2xl px-6 py-5 shadow-md w-full max-w-lg"
>
  <!-- Header -->
  <div class="flex items-center gap-4">
    <div
      class="flex items-center justify-center w-14 h-14 rounded-xl bg-[#EDF6F8] text-[#1A4A54]"
    >
      <span class="material-symbols-outlined text-3xl">
        {{ icon }}
      </span>
    </div>

    <div class="flex flex-col">
      <h3 class="text-lg font-semibold text-[#1A4A54]">
        {{ title }}
      </h3>
      <p class="text-sm text-gray-500">
        {{ text }}
      </p>
    </div>
  </div>

  <!-- Infos -->
  <div class="flex flex-col gap-2 text-sm text-[#1A4A54]">

    <div class="flex items-center gap-2">
      <span class="material-symbols-outlined text-base text-gray-400">
        event
      </span>
      <span>
        {{ formatDate(dateStart) }} → {{ formatDate(dateEnd) }}
      </span>
    </div>

    <div class="flex items-center gap-2">
      <span class="material-symbols-outlined text-base text-gray-400">
        person
      </span>
      <span>
        {{ owner }}
      </span>
    </div>

  </div>
</div>
