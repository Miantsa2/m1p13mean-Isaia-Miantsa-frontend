<div
  class="w-56 rounded-2xl border border-[#D7B471] bg-white p-4 shadow-sm"
>
  <div class="flex justify-center">
    <img
      [src]="image"
      [alt]="title"
      class="h-40 w-40 rounded-full object-cover"
    />
  </div>

  <p class="mt-4 text-center text-sm font-semibold text-[#5F6566]">
    {{ title }}
  </p>

  <div class="mt-3 flex items-center justify-between">
    <span class="text-sm font-medium text-[#3A626B]">
      Ar {{ price }}
    </span>

    <span
      class="material-symbols-outlined cursor-pointer text-[#EBAD5A]"
    >
      shopping_cart
    </span>
  </div>
</div>
