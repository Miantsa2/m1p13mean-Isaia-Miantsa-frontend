<header class="sticky top-0 z-40 flex items-center justify-between h-16 px-6 bg-white border-b border-gray-100">
  <div class="flex items-center gap-4">
    <button (click)="emitToggle()" class="flex items-center text-gray-500 transition-colors hover:text-gray-800">
      <span class="material-symbols-outlined text-[28px]">menu</span>
    </button>
  </div>

  <div class="flex items-center gap-6">
    <div class="relative group">
      <select 
        (change)="onYearChange($event)"
        class="appearance-none min-w-[110px] bg-white border border-gray-200 text-[#3A626B] text-sm font-bold rounded-lg pl-4 pr-10 py-2 cursor-pointer shadow-sm hover:border-[#67949E] hover:bg-gray-50 transition-all outline-none focus:ring-2 focus:ring-[#3A626B]/10">
        <option value="2026" selected>2026</option>
        <option value="2025">2025</option>
      </select>
      
      <span class="absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none material-symbols-outlined text-[20px] text-[#EBAD5A] group-hover:text-[#3A626B] transition-colors">
        expand_more
      </span>
    </div>

    <div class="flex items-center gap-5">
      <button mat-icon-button 
              [matMenuTriggerFor]="notifMenu"
              class="relative text-gray-400 hover:bg-gray-50"
              [matBadge]="unreadCount()" 
              [matBadgeHidden]="unreadCount() === 0"
              matBadgeColor="warn" 
              matBadgeSize="small">
        <span class="material-symbols-outlined text-[26px]">notifications</span>
      </button>

      <mat-menu #notifMenu="matMenu" xPosition="before" class="notification-menu-panel">
        <div class="w-25 max-w-[95vw] overflow-hidden rounded-xl bg-white p-2" (click)="$event.stopPropagation()">
          
          <div class="flex items-center justify-between px-4 py-3 border-b border-gray-50">
            <h3 class="text-lg font-bold text-[#3E5C65]">Notifications</h3>
            <button *ngIf="unreadCount() > 0" 
                    (click)="clearAll()" 
                    class="text-sm font-semibold text-[#C4A46F] hover:underline">
              Clear all
            </button>
          </div>

          <div class="max-h-[400px] overflow-y-auto">
            <ng-container *ngIf="unreadCount() > 0; else emptyState">
              <div *ngFor="let notif of unreadNotifications()" 
                   class="flex gap-3 p-4 transition-colors rounded-lg cursor-pointer hover:bg-gray-50">
                <div class="flex items-center justify-center flex-shrink-0 w-10 h-10 border border-gray-200 rounded-full bg-gray-50">
                  <span class="text-gray-600 material-symbols-outlined">person</span>
                </div>

                <div class="flex-1 min-w-0">
                  <div class="flex items-center justify-between">
                    <p class="text-sm font-bold text-[#3E5C65]">{{ notif.titre }}</p>
                    <span class="text-xs text-gray-400">
                      {{ notif.date_envoyee | date: 'dd/MM/yyyy' }}
                    </span>
                  </div>
                  <p class="mt-0.5 text-sm text-gray-500 leading-snug line-clamp-2">
                    {{ notif.description }}
                  </p>
                </div>
              </div>
            </ng-container>

            <ng-template #emptyState>
              <div class="flex flex-col items-center justify-center px-6 py-10 text-center">
                <span class="material-symbols-outlined text-[48px] text-gray-200 mb-2">notifications_off</span>
                <p class="font-medium text-gray-500">No notifications for the moment</p>
                <p class="mt-1 text-xs text-gray-400">We'll let you know when something happens.</p>
              </div>
            </ng-template>
          </div>
        </div>
      </mat-menu>

      <button (click)="openSettings()" class="flex items-center text-gray-400 hover:text-gray-600">
        <span class="material-symbols-outlined text-[32px] text-[#697F84]">manage_accounts</span>
      </button>
    </div>
  </div>
</header>

<app-modal-form 
  *ngIf="isModalOpen" 
  [isOpen]="isModalOpen"
  [buttonText]="'SAVE CHANGES'"
  title="SETTINGS" 
  (close)="closeSettings()"
  (submitForm)="saveChanges()"
>

  <div class="flex justify-end mb-4">
    <button  (click)="logout()" class="flex items-center gap-2 text-red-500 transition-colors hover:text-red-700 group">
      <span class="text-[10px] font-bold uppercase">Logout</span>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 transition-transform group-hover:translate-x-1">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
      </svg>
    </button>
  </div>
  <div class="flex gap-10">
    <div class="flex flex-col items-center">
      <div class="relative group">
        <div class="w-24 h-24 overflow-hidden border-2 border-gray-100 rounded-full shadow-sm">
          <img [src]="storeData.logo || '/image.png'" 
              alt="Logo" 
              class="object-cover w-full h-full">
        </div>
  
        <div class="absolute bottom-0 right-0 flex items-center justify-center w-8 h-8 transition-colors bg-white border border-gray-200 rounded-full shadow-lg cursor-pointer hover:bg-gray-50">
          <span class="text-gray-500 text-[18px] material-symbols-outlined">edit</span>
          <input 
            type="file"
            #fileInput
            class="absolute inset-0 opacity-0 cursor-pointer"
            accept="public/*"
          >
        </div>
      </div>
    </div>

    <div class="flex-1">
      <div class="grid grid-cols-2 gap-x-6 gap-y-4">
        
        <div>
          <label class="block text-[10px] text-[#697F84] uppercase mb-1">Room</label>
          <input readonly type="text" [(ngModel)]="storeData.room" class="w-full px-3 py-2 text-gray-500 border border-gray-200 rounded-lg outline-none bg-gray-50/30">
        </div>
        <div>
          <label class="block text-[10px] text-[#697F84] uppercase mb-1">Categorie</label>
          <input readonly type="text" [(ngModel)]="storeData.category" class="w-full px-3 py-2 text-gray-500 border border-gray-200 rounded-lg bg-gray-50/30">
        </div>

        <div>
          <div class="flex items-center gap-1 mb-1">
            <label class="block text-[10px] text-[#697F84] uppercase font-bold">Store Name</label>
            <span *ngIf="isDirty('name')" class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span>
          </div>
          <input type="text" 
                [(ngModel)]="storeData.name" 
                [ngClass]="{'border-red-300 ring-1 ring-red-100': isDirty('name')}"
                class="w-full px-3 py-2 text-gray-500 transition-all border border-gray-200 rounded-lg outline-none">
        </div>
        <div>
          <label class="block text-[10px] text-[#697F84] uppercase mb-1">Opening Date</label>
          <input readonly type="text" [value]="storeData.createdAt | date:'dd-MM-yyyy'" class="w-full px-3 py-2 text-gray-500 border border-gray-200 rounded-lg bg-gray-50/30">
        </div>

        <div>
          <label class="block text-[10px] text-[#697F84] uppercase mb-1">Address E-mail</label>
          <input readonly type="email" [(ngModel)]="storeData.email" class="w-full px-3 py-2 text-gray-500 border border-gray-200 rounded-lg bg-gray-50/30">
        </div>
        <div>
          <div class="flex items-center gap-1 mb-1">
            <label class="block text-[10px] text-[#697F84] uppercase font-bold">Phone Number</label>
            <span *ngIf="isDirty('phone')" class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span>
          </div>
          <input type="text" 
                [(ngModel)]="storeData.phone" 
                [ngClass]="{'border-red-300 ring-1 ring-red-100': isDirty('phone')}"
                class="w-full px-3 py-2 text-gray-500 border border-gray-200 rounded-lg outline-none">
        </div>

        <div class="col-span-2 mt-4">
          <div class="flex items-center justify-between mb-2">
            <label class="block text-[10px] text-[#697F84] uppercase font-bold tracking-wider">
              Opening and Closing Times
            </label>
            <button type="button" (click)="addHoraire()" 
                    class="flex items-center gap-1 text-[#7FAE7D] hover:text-[#5a7e58] transition-colors">
              <span class="material-symbols-outlined text-[18px]">add_circle</span>
              <span class="text-[10px] font-bold">ADD HOURS</span>
            </button>
          </div>

          <div *ngFor="let horaire of storeData.horaires; let i = index" class="flex items-center gap-3 mb-3 group">
            
            <div class="flex-1">
              <input type="text" [(ngModel)]="horaire.jour" 
                    placeholder="Day (ex: Mon-Fri)" 
                    class="w-full px-3 py-2 text-[13px] text-gray-500 border border-gray-200 rounded-lg bg-white outline-none">
            </div>
            
            <div class="flex items-center gap-2">
              <input type="text" [(ngModel)]="horaire.ouverture" 
                    placeholder="09:00" 
                    class="w-20 px-3 py-2 text-[13px] text-gray-500 border border-gray-200 rounded-lg bg-white outline-none text-center">
              
              <span class="text-gray-400">-</span>
              
              <input type="text" [(ngModel)]="horaire.fermeture" 
                    placeholder="19:00" 
                    class="w-20 px-3 py-2 text-[13px] text-gray-500 border border-gray-200 rounded-lg bg-white outline-none text-center">
            </div>

            <button *ngIf="storeData.horaires.length > 1" (click)="removeHoraire(i)"
                    class="text-gray-300 transition-colors hover:text-red-400">
              <span class="material-symbols-outlined text-[20px]">delete</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</app-modal-form>
