<header class="sticky top-0 z-40 flex items-center justify-between h-16 px-6 bg-white border-b border-gray-100">
  <div class="flex items-center gap-4">
    <button class="flex items-center text-gray-500 transition-colors hover:text-gray-800">
      <span class="material-symbols-outlined text-[28px]">menu</span>
    </button>
  </div>

  <div class="flex items-center gap-6">
    <div class="relative">
      <select class="appearance-none bg-gray-50 border border-gray-200 text-gray-600 text-sm rounded-lg pl-4 pr-10 py-1.5 focus:outline-none cursor-pointer">
        <option selected>2026</option>
        <option>2025</option>
      </select>
      <span class="absolute text-xl text-gray-400 -translate-y-1/2 pointer-events-none material-symbols-outlined right-2 top-1/2">expand_more</span>
    </div>

    <div class="flex items-center gap-5">
      <button mat-icon-button 
              class="text-gray-400"
              matBadge="0" 
              matBadgeColor="warn" 
              matBadgeSize="small">
        <span class="material-symbols-outlined text-[26px]">notifications</span>
      </button>

      <button class="flex items-center text-gray-400 hover:text-gray-600">
        <span class="material-symbols-outlined text-[32px] text-[#697F84]">manage_accounts</span>
      </button>
    </div>
  </div>
</header>
