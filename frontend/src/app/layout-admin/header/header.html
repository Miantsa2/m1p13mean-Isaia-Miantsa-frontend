<header class="sticky top-0 z-40 flex items-center justify-between h-16 px-6 bg-white border-b border-gray-100">
  <div class="flex items-center gap-4">
    <button (click)="emitToggle()" class="flex items-center text-gray-500 transition-colors hover:text-gray-800">
      <span class="material-symbols-outlined text-[28px]">menu</span>
    </button>
  </div>

  <div class="flex items-center gap-6">
    <div class="relative">
      <select class="appearance-none bg-gray-50 border border-gray-200 text-gray-600 text-sm rounded-lg pl-4 pr-10 py-1.5 focus:outline-none cursor-pointer">
        <option selected>2026</option>
        <option>2025</option>
      </select>
      <span class="absolute text-xl text-gray-400 -translate-y-1/2 pointer-events-none material-symbols-outlined right-2 top-1/2">expand_more</span>
    </div>

    <div class="flex items-center gap-5">
      <button mat-icon-button 
              class="text-gray-400"
              matBadge="0" 
              matBadgeColor="warn" 
              matBadgeSize="small">
        <span class="material-symbols-outlined text-[26px]">notifications</span>
      </button>

      <button (click)="openSettings()" class="flex items-center text-gray-400 hover:text-gray-600">
        <span class="material-symbols-outlined text-[32px] text-[#697F84]">manage_accounts</span>
      </button>
    </div>
  </div>
</header>

<!-- Modal for settings pour voir les infos ensuite faire les modifications -->





<app-modal-form 
  [isOpen]="isModalOpen" 
  [title]="'SETTINGS'" 
  [buttonText]="'SAVE CHANGES'"
  [disable]="isFormInvalid()" 
  (close)="closeSettings()"
  (submitForm)="saveCenterInfo()"> 

  <div class="flex justify-end mb-4">
    <button  (click)="logout()" class="flex items-center gap-2 text-red-500 hover:text-red-700 transition-colors group">
      <span class="text-[10px] font-bold uppercase">Logout</span>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 group-hover:translate-x-1 transition-transform">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
      </svg>
    </button>
  </div>

  <div class="flex gap-8">
    
    <div class="flex-shrink-0">
      <div class="bg-[#1A3D44] p-6 rounded shadow-md w-32 h-24 flex items-center justify-center">
         <img src="/logo.jpg" alt="Olympia" class="w-full">
      </div>
    </div>

    <div class="grid flex-grow grid-cols-2 gap-x-6 gap-y-4">
      
      <div class="flex flex-col">
        <label class="text-[10px] font-bold text-[#697F84] uppercase mb-1">Mall Name</label>
        <input type="text" [(ngModel)]="currentCenter.nom" class="border border-gray-200 rounded-md p-2 text-gray-700 focus:outline-none focus:border-[#E5AC5F]" >
      </div>

      <div class="flex flex-col">
        <label class="text-[10px] font-bold text-[#697F84] uppercase mb-1">Main Address E-mail</label>
        <input type="email" [(ngModel)]="currentCenter.email" class="p-2 text-gray-700 border border-gray-200 rounded-md">
      </div>

      <div class="flex flex-col">
        <label class="text-[10px] font-bold text-[#697F84] uppercase mb-1">Phone number</label>
        <input type="text" [(ngModel)]="currentCenter.telephone" class="p-2 text-gray-700 border border-gray-200 rounded-md">
      </div>

      <div class="flex flex-col">
        <label class="text-[10px] font-bold text-[#697F84] uppercase mb-1">Parking Spaces</label>
        <input type="number" [(ngModel)]="currentCenter.placeParking" class="p-2 text-gray-700 border border-gray-200 rounded-md">
      </div>

      <div class="col-span-2">
        <label class="text-[10px] font-bold text-[#697F84] uppercase mb-1">Opening and Closing Times</label>
        
        @for (h of currentCenter.horaires; track $index) {
          <div class="flex gap-2 mb-2">
      

            <select [(ngModel)]="h.jour" 
                    name="jour-{{$index}}" 
                    class="w-1/3 p-1 border border-gray-200 rounded text-xs text-gray-700 outline-none focus:border-[#E5AC5F]">
                    @for (jour of getFilteredDays($index); track jour) {
                      <option [value]="jour">{{ jour }}</option>
                    }
            </select>
            
            <input type="time" 
                  [(ngModel)]="h.ouverture" 
                  name="open-{{$index}}" 
                  placeholder="Open" 
                  class="w-1/4 p-1 border rounded text-xs text-gray-700">
            
            <input type="time" 
                  [(ngModel)]="h.fermeture" 
                  name="close-{{$index}}" 
                  placeholder="Close" 
                  class="w-1/4 p-1 border rounded text-xs text-gray-700">
            
            <button type="button" (click)="removeHoraire($index)" class="text-red-500 text-xs">✕</button>
          </div>
        } @empty {
          <p class="text-[10px] text-gray-400 italic mb-2">No hours defined.</p>
        }

        <button type="button" (click)="addHoraire()" class="text-[10px] text-[#E5AC5F] font-bold uppercase hover:underline">
          + Add Day
        </button>
      </div>

   

    </div>
  </div>

</app-modal-form>
