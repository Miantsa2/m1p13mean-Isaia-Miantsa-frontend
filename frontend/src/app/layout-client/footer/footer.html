<footer class="bg-[#F2EFEF] text-[#1A4A54] text-[11px] w-full">
  <div class="px-12 py-10 mx-auto max-w-7xl">
    <ng-container [ngSwitch]="footerType">

      <ng-container *ngSwitchCase="'footer1'">
        <div class="flex items-start justify-between">
          <div class="space-y-1">
            <h3 class="mb-4 font-bold uppercase tracking-wider text-[13px] text-[#3A626B]">
              {{ footerData.title }}
            </h3>
            <p class="font-medium text-[#697F84] tracking-tight">{{ footerData.phone }}</p>
            <p class="font-medium text-[#697F84] tracking-tight">{{ footerData.email }}</p>
          </div>

          <div class="flex flex-col items-center">
            <img *ngIf="footerData.logoUrl" [src]="footerData.logoUrl" 
                 class="object-contain h-16 mb-1" alt="Olympia Logo" />
            
            <p class="text-[9px] font-medium tracking-tighter mb-3">
              Largest shopping mall in Madagascar
            </p>

            <div class="flex justify-center gap-3 mt-1">
              <a href="#" target="_blank" class="flex items-center justify-center w-5 h-5 transition-opacity hover:opacity-75">
                  <img src="/facebook.png" alt="Facebook" class="object-contain max-w-full max-h-full">
              </a>

              <a href="#" target="_blank" class="flex items-center justify-center w-5 h-5 transition-opacity hover:opacity-75">
                  <img src="/instagram.png" alt="Instagram" class="object-contain max-w-full max-h-full">
              </a>

              <a href="#" target="_blank" class="flex items-center justify-center w-5 h-5 transition-opacity hover:opacity-75">
                  <img src="/twitter.png" alt="X" class="object-contain max-w-full max-h-full">
              </a>
            </div>
          </div>
        </div>
      </ng-container>

      <ng-container *ngSwitchCase="'footer2'">
        <div *ngIf="footerData" class="flex items-start justify-between">
          <div class="space-y-1">
            <h3 class="mb-4 font-bold uppercase tracking-wider text-[13px] text-[#3A626B]">
              {{ footerData.title }}
            </h3>
            <p class="font-medium text-[#697F84] tracking-tight">{{ footerData.phone }}</p>
            <p class="font-medium text-[#697F84] tracking-tight">{{ footerData.email }}</p>
          </div>

          <div class="flex flex-col items-center">
            <img *ngIf="footerData.logoUrl" [src]="footerData.logoUrl" 
                 class="object-cover w-20 h-20 mb-3 rounded-full shadow-sm" alt="Pasta Logo" />

            <div class="flex justify-center gap-3">
              <a href="#" target="_blank" class="flex items-center justify-center w-5 h-5 transition-opacity hover:opacity-75">
                  <img src="/facebook.png" alt="Facebook" class="object-contain max-w-full max-h-full">
              </a>

              <a href="#" target="_blank" class="flex items-center justify-center w-5 h-5 transition-opacity hover:opacity-75">
                  <img src="/instagram.png" alt="Instagram" class="object-contain max-w-full max-h-full">
              </a>

              <a href="#" target="_blank" class="flex items-center justify-center w-5 h-5 transition-opacity hover:opacity-75">
                  <img src="/twitter.png" alt="X" class="object-contain max-w-full max-h-full">
              </a>
            </div>
          </div>
        </div>
      </ng-container>

    </ng-container>
  </div>

  <div class="px-12 pb-8 mx-auto max-w-7xl">
    <div class="flex justify-end pt-4 border-t border-gray-400">
      <p class="text-[14px] font-medium text-[#355F68] tracking-tight">
        RANAIVOSON Miantsa Fitia - NIRINA Isaia Joëlle
      </p>
    </div>
  </div>
</footer>
