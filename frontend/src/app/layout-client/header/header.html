<header class="w-full bg-white border-b border-gray-100">
  <ng-container [ngSwitch]="headerType">
    <!-- Header Type 1 -->
    <ng-container *ngSwitchCase="'header1'">
      <div class="flex items-center justify-between px-8 py-3 mx-auto max-w-7xl">
        <div class="flex flex-col items-center leading-tight items">
          <span class="text-lg font-bold text-[#D9B570] tracking-widest leading-none">OLYMPIA</span>
          <span class="text-[15px] text-[#D9B570] font-normal tracking-tighter">Tanjombato</span>
        </div>

        <nav class="flex items-center gap-8 text-[16px] font-light text-[#1A4A54]">
          <a class="cursor-pointer hover:text-[#EBAD5A] transition-colors ">HOME</a>
          <a class="flex items-center gap-1 cursor-pointer hover:text-[#EBAD5A] transition-colors">
            CATEGORIES <span class="text-sm material-symbols-outlined">expand_more</span>
          </a>
          <a class="cursor-pointer hover:text-[#EBAD5A] transition-colors">EVENTS</a>
          <a class="cursor-pointer hover:text-[#EBAD5A] transition-colors">ABOUT US</a>
          <a class="cursor-pointer hover:text-[#EBAD5A] transition-colors">CONTACT</a>
        </nav>

        <app-button-primaire text="VISIT" [route]="['/login']"></app-button-primaire>
      </div>
    </ng-container>

    <!-- Header Type 2 -->
    <ng-container *ngSwitchCase="'header2'">
      <div class="flex items-center justify-between px-8 py-4 mx-auto max-w-7xl">
        <a routerLink="/" class="cursor-pointer contents">
            <div class="font-black text-[#333] uppercase tracking-tighter text-[17px]">
                EXPLORE
            </div>
        </a>

        <nav class="flex items-center gap-10 text-[16px] font-light text-[#1A4A54]">
          <a class="cursor-pointer hover:text-[#EBAD5A] transition-colors">HOME</a>
          <a class="cursor-pointer hover:text-[#EBAD5A] transition-colors">PRODUCTS</a>
          <a class="cursor-pointer hover:text-[#EBAD5A] transition-colors">EVENTS</a>
          <a class="cursor-pointer hover:text-[#EBAD5A] transition-colors">CONTACT</a>
        </nav>

        <div class="relative group">
          <input
            type="text"
            placeholder="Search..."
            class="pl-4 pr-10 py-1.5 text-xs border border-gray-300 rounded-md w-48 bg-gray-50 outline-none focus:border-[#c99f55] focus:ring-1 focus:ring-[#c99f55] transition-all"
          />
          <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm group-focus-within:text-[#c99f55]">search</span>
        </div>
      </div>
    </ng-container>

    <!-- Header Type 3 -->
    <ng-container *ngSwitchCase="'header3'">
        <div class="grid items-center grid-cols-3 px-8 py-3 mx-auto max-w-7xl">
            
            <div class="flex justify-start">
                <div class="font-black text-[#333] uppercase tracking-tighter text-[17px]">EXPLORE</div>
            </div>

            <nav class="flex items-center justify-center gap-8 text-[16px] font-light text-[#1A4A54]">
                <a routerLink="/home" routerLinkActive="text-[#EBAD5A] font-normal" class="cursor-pointer hover:text-[#EBAD5A] transition-colors">HOME</a>
                <a routerLink="/products" routerLinkActive="text-[#EBAD5A] font-normal" class="cursor-pointer hover:text-[#EBAD5A] transition-colors">PRODUCTS</a>
                <a routerLink="/events" routerLinkActive="text-[#EBAD5A] font-normal" class="cursor-pointer hover:text-[#EBAD5A] transition-colors">EVENTS</a>
                <a routerLink="/contact" routerLinkActive="text-[#EBAD5A] font-normal" class="cursor-pointer hover:text-[#EBAD5A] transition-colors">CONTACT</a>
            </nav>

            <div class="hidden md:block"></div>

        </div>
        </ng-container>

  </ng-container>
</header>
