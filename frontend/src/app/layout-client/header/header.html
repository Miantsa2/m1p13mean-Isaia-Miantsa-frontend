<header class="fixed top-0 left-0 z-50 w-full border-b border-gray-100 shadow-sm bg-white/90 backdrop-blur-sm">
  <ng-container [ngSwitch]="headerType">
    <!-- Header Type 1 -->
    <ng-container *ngSwitchCase="'header1'">
      <div class="flex items-center justify-between px-8 py-3 mx-auto max-w-7xl">
        <div class="flex flex-col items-center leading-tight items">
          <span class="text-lg font-bold text-[#D9B570] tracking-widest leading-none">{{ centreInfo?.nom || 'SAMI' }}</span>
          <span class="text-[15px] text-[#D9B570] font-normal tracking-tighter">Iavoloha</span>
        </div>
        <nav class="flex items-center gap-8 text-[16px] font-light text-[#1A4A54]">
          <a (click)="scrollToSection('home')" class="cursor-pointer hover:text-[#EBAD5A] transition-colors">HOME</a>
          
          <div class="relative group" (mouseenter)="showDropdown = true" (mouseleave)="showDropdown = false">
            <a class="flex items-center gap-1 cursor-pointer hover:text-[#EBAD5A] transition-colors">
              CATEGORIES <span class="text-sm transition-transform material-symbols-outlined" [class.rotate-180]="showDropdown">expand_more</span>
            </a>

            <div *ngIf="showDropdown" 
                class="absolute left-0 z-50 w-48 py-2 mt-0 bg-white border border-gray-100 rounded-md shadow-xl">
              <a (click)="selectCategory('')" class="block px-4 py-2 text-sm text-[#1A4A54] hover:bg-gray-50 hover:text-[#EBAD5A] cursor-pointer">
                All categories
              </a>
              <hr class="my-1 border-gray-50">
              <a *ngFor="let cat of categories" 
                (click)="selectCategory(cat._id)"
                class="block px-4 py-2 text-sm text-[#1A4A54] hover:bg-gray-50 hover:text-[#EBAD5A] cursor-pointer">
                {{ cat.nom }}
              </a>
            </div>
          </div>

          <a (click)="scrollToSection('events-section')" class="cursor-pointer hover:text-[#EBAD5A] transition-colors">EVENTS</a>
          
          <a (click)="scrollToSection('about-section')" class="cursor-pointer hover:text-[#EBAD5A] transition-colors">ABOUT US</a>
          
          <a (click)="scrollToSection('contact-section')" class="cursor-pointer hover:text-[#EBAD5A] transition-colors">CONTACT</a>
        </nav>

        <div class="flex items-center gap-4">
          <div *ngIf="isLoggedIn" class="relative group">
            <input
              type="text"
              (input)="onSearch($event)"
              placeholder="Search stores..."
              class="pl-4 pr-10 py-1.5 text-xs border border-gray-200 rounded-full w-48 bg-gray-50 outline-none focus:border-[#D9B570] focus:ring-1 focus:ring-[#D9B570] transition-all"
            />
            <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm group-focus-within:text-[#D9B570]">
              search
            </span>
          </div>

          <app-button-primaire 
            *ngIf="!isLoggedIn" 
            text="VISIT" 
            [route]="['/login']">
          </app-button-primaire>

          <button *ngIf="isLoggedIn" (click)="logout()" class="text-[#1A4A54] hover:text-red-500 transition-colors">
            <span class="material-symbols-outlined">logout</span>
          </button>

          <div class="flex items-center cursor-pointer">
            <span routerLink="/cart" class="material-symbols-outlined text-[#EBAD5A] text-2xl">shopping_cart</span>
          </div>

          <div class="flex items-center cursor-pointer">
            <span routerLink="/livraison" class="material-symbols-outlined text-[#EBAD5A] text-2xl">delivery_truck_bolt</span>
          </div>

        </div>
      </div>
    </ng-container>

    <!-- Header Type 2 -->
    <ng-container *ngSwitchCase="'header2'">
      <div class="flex items-center justify-between px-8 py-4 mx-auto max-w-7xl">
        <a routerLink="/home" class="cursor-pointer contents">
            <div class="font-black text-[#333] uppercase tracking-tighter text-[17px]">
                EXPLORE
            </div>
        </a>

        <nav class="flex items-center gap-10 text-[16px] font-light text-[#1A4A54]">
          <a (click)="scrollToSection('about-section')" class="cursor-pointer hover:text-[#EBAD5A] transition-colors">ABOUT</a>
          <a (click)="scrollToSection('products-section')" class="cursor-pointer hover:text-[#EBAD5A] transition-colors">PRODUCTS</a>
          <a (click)="scrollToSection('event-section')" class="cursor-pointer hover:text-[#EBAD5A] transition-colors">EVENTS</a>
          <a (click)="scrollToSection('contact-section')" class="cursor-pointer hover:text-[#EBAD5A] transition-colors">CONTACT</a>
        </nav>

        <div class="flex items-center gap-4 group">
          <div class="relative">
            <input
              type="text"
              placeholder="Search products"
              (input)="onSearch($event)"
              class="pl-4 pr-10 py-1.5 text-xs border border-gray-300 rounded-md w-48 bg-gray-50 outline-none focus:border-[#c99f55] focus:ring-1 focus:ring-[#c99f55] transition-all"
            />
            <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm group-focus-within:text-[#c99f55]">
              search
            </span>
          </div>

          <div class="flex items-center cursor-pointer">
            <span routerLink="/cart" class="material-symbols-outlined text-[#EBAD5A] text-3xl">shopping_cart</span>
          </div>

          <div class="flex items-center cursor-pointer">
            <span routerLink="/livraison" class="material-symbols-outlined text-[#EBAD5A] text-3xl">delivery_truck_bolt</span>
          </div>
        </div>
      </div>

      <!-- Icon flottante pour le panier -->
      <div *ngIf="cartService.cartCount() > 0" 
        routerLink="/cart"
          class="fixed z-50 top-24 right-8 animate-bounce-in">
        <div class="relative p-3 transition-transform bg-white border border-gray-100 rounded-full shadow-xl cursor-pointer hover:scale-110">
          <span class="material-symbols-outlined text-[#EBAD5A] text-3xl">shopping_cart</span>
          
          <span class="absolute -top-1 -right-1 bg-[#E15B5B] text-white text-[10px] font-bold h-5 w-5 flex items-center justify-center rounded-full border-2 border-white">
            {{ cartService.cartCount() }}
          </span>
        </div>
      </div>
    </ng-container>

    <!-- Header Type 3 -->
    <ng-container *ngSwitchCase="'header3'">
      <div class="grid items-center grid-cols-3 px-8 py-3 mx-auto max-w-7xl">
          
          <div (click)="goBack()" class="flex justify-start cursor-pointer">
              <div class="font-black text-[#333] uppercase tracking-tighter text-[17px]">GO BACK</div>
          </div>

          <div class="hidden md:block"></div>

          <div class="flex justify-end">
          <!-- Bouton Export PDF dans le header -->
          <div *ngIf="invoiceElement" class="no-pdf">
            <app-button-primaire text="Export PDF" (click)="downloadPDF()"></app-button-primaire>
          </div>
      </div>

      </div>
    </ng-container>


  </ng-container>
</header>
